<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Digger Radio</title>
  <link rel="icon" href="{{ url_for('static', filename='digger-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/radio.css') }}">
</head>
<body>
  <main class="page">
    <header class="brand"><a href="/"><img class="brand-logo" src="{{ url_for('static', filename='digger-logo-horizontal.png') }}" alt="Digger Radio — Accueil"></a></header>
    <section class="player-card">
      <h1>Connexion avec un compte de test</h1>
      <p>Utilisez les identifiants qui vous ont été remis pour la preview.</p>
      <form id="local-login" method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p><label>Email <input name="email" type="email" required autocomplete="username"></label></p>
        <p><label>Mot de passe <input name="password" type="password" required autocomplete="current-password"></label></p>
        <button type="submit">Se connecter</button>
      </form>
      <p id="login-result" role="status" aria-live="polite"></p>
      <p><a href="/">Retour à l’accueil</a></p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/local-login.js') }}"></script>
</body>
</html>
